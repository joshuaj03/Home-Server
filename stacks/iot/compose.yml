services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ../../data/mosquitto/config:/mosquitto/config
      - ../../data/mosquitto/data:/mosquitto/data
      - ../../data/mosquitto/log:/mosquitto/log
    networks:
      - iot_net

  flask_app:
    build: ./flask_app
    image: ghcr.io/joshuaj03/iot-dashboard-flask_app:latest
    container_name: flask_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: "mosquitto"
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-homepi}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-mqtt@homepi}
      INFLUX_ENABLED: ${INFLUX_ENABLED:-true}
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-homepi_token124}
      INFLUX_ORG: ${INFLUX_ORG:-homeiot}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-SENSORS}
      FLASK_PORT: "5000"
    depends_on:
      - mosquitto
    networks:
      - iot_net
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  wyoming-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    command:
      - --voice
      - en_US-lessac-high
      - --uri
      - tcp://0.0.0.0:10200
      - --data-dir
      - /data
      - --download-dir
      - /data
    volumes:
      - ../../data/wyoming-piper:/data
    ports:
      - "10200:10200"
    networks:
      - iot_net

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - mosquitto
      - wyoming-piper
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ../../data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

networks:
  iot_net:
    name: iot_net
    driver: bridge

