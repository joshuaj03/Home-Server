services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ../../data/mosquitto/config:/mosquitto/config
      - ../../data/mosquitto/data:/mosquitto/data
      - ../../data/mosquitto/log:/mosquitto/log
    networks:
      - iot_net

  flask_app:
    build: ./flask_app
    image: iot-dashboard-flask_app:latest
    container_name: flask_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: "mosquitto"
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-homepi}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-mqtt@homepi}
      INFLUX_ENABLED: ${INFLUX_ENABLED:-true}
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-homepi_token124}
      INFLUX_ORG: ${INFLUX_ORG:-homeiot}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-SENSORS}
      FLASK_PORT: "5000"
    depends_on:
      - mosquitto
    networks:
      - iot_net
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - mosquitto
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ../../data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

networks:
  iot_net:
    name: iot_net
    driver: bridge

